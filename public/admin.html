<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Portal - Rose Buds Public School</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      
      <!-- SINGLE UNIFIED AUTH CARD -->
      <section
        id="adminAuthView"
        class="otp-screen"
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 42px 20px;
        "
      >
        <div
          class="otp-card"
          style="
            width: min(560px, 100%);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(240, 253, 250, 0.8), rgba(240, 249, 255, 0.5));
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(5, 150, 105, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.5);
            padding: 42px;
            transition: all 0.3s ease;
          "
        >
          <div style="text-align: center; margin-bottom: 20px">
            <img
              src="/assets/rose-buds-logo.png"
              alt="Rose Buds Public School logo"
              style="width: 80px; height: 80px; object-fit: contain; margin: 0 auto; display: block; background: white; border-radius: 12px; padding: 8px;"
            />
          </div>
          
          <p class="eyebrow" style="text-align: center">School Administration</p>
          
          <h2
            id="adminAuthTitle"
            style="
              margin: 10px 0 28px;
              font-size: clamp(2.2rem, 5vw, 2.8rem);
              background: linear-gradient(135deg, #059669, #3b82f6);
              -webkit-background-clip: text;
              background-clip: text;
              color: transparent;
              font-weight: 900;
              text-align: center;
            "
          >
            Admin Login
          </h2>

          <!-- STEP 1: LOGIN FORM -->
          <form id="adminLoginForm" style="display: grid; gap: 16px">
            <label style="display: grid; gap: 0.4rem; font-size: 0.92rem; font-weight: 800;">
              Email
              <input id="adminEmail" type="email" autocomplete="username" required style="width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 0.75rem; background: white; color: #0f1419;" />
            </label>
            <label style="display: grid; gap: 0.4rem; font-size: 0.92rem; font-weight: 800;">
              Password
              <input id="adminPassword" type="password" autocomplete="current-password" required style="width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 0.75rem; background: white; color: #0f1419;" />
            </label>
            <button type="submit" style="border: 0; border-radius: 12px; padding: 0.9rem 1.3rem; background: linear-gradient(135deg, #059669 0%, #3b82f6 100%); color: white; cursor: pointer; font-weight: 700; width: 100%; margin-top: 8px; font-size: 1rem;">
              Login
            </button>
          </form>

          <!-- STEP 2: OTP FORM (Initially Hidden) -->
          <form id="adminOtpForm" hidden style="display: grid; gap: 16px">
            <button id="adminBackToLogin" class="ghost small" type="button" style="justify-self: start; border: 1px solid #e5e7eb; background: white; color: #059669; border-radius: 8px; padding: 0.55rem 0.75rem; font-weight: 700; cursor: pointer; margin-bottom: 8px;">
              ← Back to Login
            </button>
            <p id="adminOtpHelp" style="color: #6b7280; text-align: center; margin-bottom: 8px;"></p>
            <label style="display: grid; gap: 0.4rem; font-size: 0.92rem; font-weight: 800;">
              6-Digit Secure Code
              <input id="adminSmsOtp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required style="width: 100%; border: 1px solid #e5e7eb; border-radius: 12px; padding: 0.75rem; background: white; color: #0f1419; text-align: center; font-size: 1.2rem; letter-spacing: 4px;" />
            </label>
            <button type="submit" style="border: 0; border-radius: 12px; padding: 0.9rem 1.3rem; background: linear-gradient(135deg, #059669 0%, #3b82f6 100%); color: white; cursor: pointer; font-weight: 700; width: 100%; margin-top: 8px; font-size: 1rem;">
              Verify & Enter Portal
            </button>
          </form>

          <!-- SHARED MESSAGE BOX -->
          <p id="adminAuthMessage" class="message" style="margin-top: 20px; text-align: center; min-height: 20px; font-weight: 600;"></p>

          <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0" />
          <div style="text-align: center">
            <a href="/" style="display: inline-block; border: 2px solid #059669; background: white; color: #059669; padding: 0.7rem 1.2rem; border-radius: 12px; text-decoration: none; font-weight: 700;">Go to Parent/Student Portal</a>
          </div>
        </div>
      </section>

      <!-- PORTAL VIEW (Hidden until auth succeeds) -->
      <section id="adminPortalView" hidden style="padding: 40px 20px">
        <div class="portal-head" style="display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 20px; margin-bottom: 32px; border: 1px solid #e5e7eb; border-radius: 12px; background: white; padding: 28px;">
          <div>
            <p class="eyebrow" id="adminRoleLabel" style="margin: 0 0 0.6rem; color: #dc2626; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; font-weight: 900;"></p>
            <h2 id="adminWelcomeTitle" style="margin: 0; font-size: clamp(1.7rem, 3vw, 2.7rem); line-height: 1.05;"></h2>
          </div>
          <button id="adminLogoutButton" style="border: 1px solid #e5e7eb; background: white; color: #059669; border-radius: 8px; padding: 0.7rem 1.2rem; font-weight: 700; cursor: pointer;">
            Logout
          </button>
        </div>
        <div id="adminMainContent"></div>
      </section>
    </main>

    <!-- Modals (Add/Edit Student) go here, exact same as before -->
    <!-- Add Student Modal -->
    <div id="addStudentModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); place-items: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px);">
      <div style="background: white; padding: 32px; border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; margin-bottom: 24px; align-items: center;">
          <h3 style="margin: 0; font-size: 1.5rem; color: #0f1419;">Add New Student</h3>
          <button type="button" id="closeModalBtn" style="border: none; background: none; font-size: 1.8rem; cursor: pointer; color: #6b7280;">&times;</button>
        </div>
        <form id="addStudentForm" style="display: grid; gap: 16px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <input type="text" id="newStdName" placeholder="Student Name" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <input type="text" id="newStdClass" placeholder="Class (e.g. 10-A)" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <input type="email" id="newStdEmail" placeholder="Student Email" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <input type="tel" id="newStdPhone" placeholder="Student Phone" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <input type="text" id="newStdPassword" placeholder="Set Student Password" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #f0fdf4;">
          </div>
          <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 8px 0;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <input type="text" id="newParentName" placeholder="Parent Name" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <input type="tel" id="newParentPhone" placeholder="Parent Phone" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <input type="email" id="newParentEmail" placeholder="Parent Email" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <input type="text" id="newParentPassword" placeholder="Set Parent Password" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #f0fdf4;">
          </div>
          <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 8px 0;">
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <input type="number" id="newTotalFees" placeholder="Total Fees" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <input type="number" id="newPaidAmount" placeholder="Initial Paid" value="0" style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <input type="date" id="newDueDate" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: inherit;">
          </div>
          <button type="submit" style="margin-top: 12px; border: 0; border-radius: 12px; padding: 1rem; background: linear-gradient(135deg, #059669 0%, #3b82f6 100%); color: white; cursor: pointer; font-weight: 700; font-size: 1rem;">
            Save Student & Generate Logins
          </button>
        </form>
      </div>
    </div>

    <!-- Edit Student Modal -->
    <div id="editStudentModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); place-items: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px);">
      <div style="background: white; padding: 32px; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; margin-bottom: 24px; align-items: center;">
          <h3 style="margin: 0; font-size: 1.5rem; color: #0f1419;">Edit Student</h3>
          <button type="button" id="closeEditModalBtn" style="border: none; background: none; font-size: 1.8rem; cursor: pointer; color: #6b7280;">&times;</button>
        </div>
        <form id="editStudentForm" style="display: grid; gap: 16px;">
          <input type="hidden" id="editStdId">
          <input type="text" id="editStdName" placeholder="Student Name" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
          <input type="text" id="editStdClass" placeholder="Class (e.g. 10-A)" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <input type="number" id="editTotalFees" placeholder="Total Fees" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
            <input type="number" id="editPaidAmount" placeholder="Paid Amount" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
          </div>
          <input type="date" id="editDueDate" required style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-family: inherit;">
          <button type="submit" style="margin-top: 12px; border: 0; border-radius: 12px; padding: 1rem; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; cursor: pointer; font-weight: 700; font-size: 1rem;">
            Update Student
          </button>
        </form>
      </div>
    </div>
    
    <script src="/admin.js"></script>
  </body>
</html>
